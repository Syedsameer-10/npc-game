# =========================================================================
# Render.com Blueprint (render.yaml)
# NPC Behavior Compiler & Simulation Workbench
# Docs: https://render.com/docs/blueprint-spec
# =========================================================================

services:
  # -----------------------------------------------------------------------
  # UNIFIED WEB SERVICE (Recommended)
  # Deploys both FastAPI backend and React frontend under a single URL.
  # Eliminates CORS issues and optimizes Render's free tier.
  # -----------------------------------------------------------------------
  - type: web
    name: npc-behavior-compiler
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0

